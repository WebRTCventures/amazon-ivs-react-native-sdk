# Release APK of the example app for testers. See example/README.md.

name: Android example

on:
  push:
    tags: ['example-android-*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK as a GitHub prerelease
        type: boolean
        default: false

concurrency:
  group: android-example-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
      version-name: ${{ steps.apk.outputs.version-name }}
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Set version name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#example-android-}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn prepare

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Use the template stage config
        run: cp example/src/stage.config.example.ts example/src/stage.config.ts

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_EXAMPLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ORG_GRADLE_PROJECT_ivsExampleReleaseStoreFile=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signed with the release keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::ANDROID_EXAMPLE_KEYSTORE_BASE64 is not set; signing with the debug keystore."
            echo "Signed with the **debug** keystore (no release keystore secret)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble release APK
        working-directory: example/android
        env:
          ORG_GRADLE_PROJECT_ivsExampleReleaseStorePassword: ${{ secrets.ANDROID_EXAMPLE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ivsExampleReleaseKeyAlias: ${{ secrets.ANDROID_EXAMPLE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ivsExampleReleaseKeyPassword: ${{ secrets.ANDROID_EXAMPLE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -PivsExampleVersionCode="$VERSION_CODE"
          -PivsExampleVersionName="$VERSION_NAME"

      - name: Name the APK
        id: apk
        run: |
          name="ivs-example-android-$VERSION_NAME.apk"
          mv example/android/app/build/outputs/apk/release/app-release.apk "$name"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK: \`$name\` (versionCode $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ivs-example-android-${{ env.VERSION_NAME }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: build
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ivs-example-android-${{ needs.build.outputs.version-name }}

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ needs.build.outputs.apk-name }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
        # Never v*: those tags publish the library to npm.
        run: >
          gh release create "example-android-$VERSION_NAME"
          "$APK"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --prerelease
          --title "Android example $VERSION_NAME"
          --notes "Test build of the example app from $GITHUB_SHA.
          Install the APK on an Android phone (allow installs from your browser or files app).
          It ships without a participant token: open Debug, then Token, and paste the token you were sent."
