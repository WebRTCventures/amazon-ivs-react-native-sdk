# CI

name: CI

on:
  pull_request:
    branches: [main, feat/sdk-v1]
  push:
    branches: [main, feat/sdk-v1]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Jest (unit + parity)
        run: yarn test

      - name: Build library (bob)
        run: yarn prepare

  android:
    name: Android assemble
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn prepare

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Assemble example debug APK
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload example APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: example-android-debug-apk
          path: example/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  android-unit:
    name: Android mapping unit tests
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run JUnit mapping tests
        working-directory: example/android
        run: ./gradlew :amazon-ivs-react-native-sdk:testDebugUnitTest --no-daemon

  ios:
    name: iOS example build
    runs-on: macos-15
    needs: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn prepare

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Pod install
        working-directory: example/ios
        run: RCT_NEW_ARCH_ENABLED=1 pod install

      - name: Build example app (simulator)
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace AmazonIvsRealTimeExample.xcworkspace \
            -scheme AmazonIvsRealTimeExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions
